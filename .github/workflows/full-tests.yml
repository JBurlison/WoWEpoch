name: Full addon tests (manual)

# Intentionally no push, pull_request, or scheduled trigger. This is the
# expensive suite; maintainers choose when its extra coverage is worth a run.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-addon-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: Full regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run full addon regressions
        run: python -B -X utf8 tests/run.py
